name: OrvexaAuth Android Beta

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OrvexaAuth Beta 0.1.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Create APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvexaauth-beta-0.1.1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.1-beta01-${{ github.run_number }}"
          name: "OrvexaAuth Beta 0.1.1 (build ${{ github.run_number }})"
          prerelease: true
          draft: false
          make_latest: false
          body: |
            ## OrvexaAuth Beta 0.1.1

            Cloudflare-only Android client for the public OrvexaAuth API.

            ### Included
            - HTTPS-only API transport.
            - Android Keystore-backed encrypted session material.
            - No Firebase, Google Sign-In, Google Drive or local server mode.
            - No saved server endpoints or server discovery UI.
            - Beta build for testing; backup and recovery features may change.

            Verify the APK with `app-debug.apk.sha256` before installation.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          fail_on_unmatched_files: true
